[Service]
Nice=10
IOSchedulingClass=best-effort
IOSchedulingPriority=7
# Debian's unit sets PrivateDevices=yes, which drops CAP_MKNOD: device nodes in a backup (e.g. docker's
# overlay2/*/merged/dev/*) then fail with "mknod: Operation not permitted" and every run ends with rsync code 23.
PrivateDevices=no
