# WD My Cloud: one disk. -a = health, attributes, error and self-test logs, pending/uncorrectable sectors.
# -o on: automatic offline data collection, -S on: attribute autosave, -n standby,q: never wake a sleeping disk.
# -W 4,50,55: log temperature changes >= 4 C, warn at 50 C, critical at 55 C.
# -s: long self-test every Sunday at 09:00 local (~7 h, finishes well before the 01:00 UTC backup),
#     short self-test every day at 12:00 local.
/dev/sda -a -o on -S on -n standby,q -W 4,50,55 -s (L/../../7/09|S/../.././12) -m root -M exec /usr/local/bin/smartd-alert.sh
